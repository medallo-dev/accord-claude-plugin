name: Validate plugin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Latest on purpose: the validator should match the rules the directory
      # portal applies today, not the ones from when this file was written.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: claude plugin validate --strict
        run: |
          claude --version
          claude plugin validate --strict .

      # Directory rules the CLI reports only as warnings (or not at all).
      - name: Directory checks
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Icon: square PNG, 512-2048 px, under 2 MB.
          icon=".claude-plugin/icon.png"
          [ -f "$icon" ] || fail "$icon is missing"
          info=$(file -b "$icon")
          [[ "$info" =~ ^PNG\ image\ data,\ ([0-9]+)\ x\ ([0-9]+) ]] || fail "$icon is not a PNG: $info"
          w=${BASH_REMATCH[1]}; h=${BASH_REMATCH[2]}
          [ "$w" = "$h" ] || fail "$icon must be square (is ${w}x${h})"
          { [ "$w" -ge 512 ] && [ "$w" -le 2048 ]; } || fail "$icon must be 512-2048 px (is ${w})"
          [ "$(stat -c %s "$icon")" -lt 2097152 ] || fail "$icon must be under 2 MB"
          jq -e '.icon == "./.claude-plugin/icon.png"' .claude-plugin/plugin.json >/dev/null \
            || fail "plugin.json icon must be ./.claude-plugin/icon.png"

          # README: at least 40 words outside code blocks.
          words=$(awk '/^```/{c=!c; next} !c' README.md | wc -w)
          [ "$words" -ge 40 ] || fail "README.md needs at least 40 words outside code blocks (has $words)"

          # License, required metadata, listing URLs over https.
          [ -f LICENSE ] || fail "LICENSE is missing"
          jq -e '.version and .description and .author.name and .license' .claude-plugin/plugin.json >/dev/null \
            || fail "plugin.json needs version, description, author.name and license"
          for key in homepage documentationUrl supportUrl privacyPolicyUrl termsOfServiceUrl; do
            jq -e --arg k "$key" '.[$k] | startswith("https://")' .claude-plugin/plugin.json >/dev/null \
              || fail "plugin.json $key must be an https:// URL"
          done

          # Marketplace entry name matches the manifest name.
          [ "$(jq -r .name .claude-plugin/plugin.json)" = "$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)" ] \
            || fail "marketplace.json entry name must equal plugin.json name"

          # Remote MCP servers only, over https, without credentials in headers.
          jq -e '.mcpServers | to_entries | all(.value.type == "http" and (.value.url | startswith("https://")) and (.value.headers == null))' .mcp.json >/dev/null \
            || fail ".mcp.json servers must be type http with an https:// url and no headers"

          # Files the directory refuses.
          bad=$(git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini|__MACOSX)(/|$)' || true)
          [ -z "$bad" ] || fail "system files committed: $bad"

          echo "Directory checks passed"

      # Installed copies and the directory key on `version`: a release that
      # changes the plugin without bumping it never reaches users.
      - name: Version bumped
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- . ':(exclude).github' ':(exclude).gitignore')
          if [ -z "$changed" ]; then
            echo "Only CI files changed; no version bump needed"
            exit 0
          fi
          old=$(git show "$base:.claude-plugin/plugin.json" | jq -r .version)
          new=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$old" = "$new" ]; then
            echo "::error::Plugin files changed but .claude-plugin/plugin.json version is still $old. Bump it."
            echo "$changed"
            exit 1
          fi
          echo "version $old -> $new"
